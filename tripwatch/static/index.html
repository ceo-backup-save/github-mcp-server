<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TripWatch AI — rastreamento de voos e hotéis com agentes</title>
  <meta name="description" content="Monitore preços de voos e hotéis com agentes de IA, buscas agendadas e alertas. Servidor MCP incluído." />
  <link rel="stylesheet" href="/static/styles.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%9B%81%3C/text%3E%3C/svg%3E" />
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17.8 19.2 16 11l3.5-3.5a2.1 2.1 0 0 0-3-3L13 8 4.8 6.2a1 1 0 0 0-.9 1.7l5.6 3.4-2.2 2.2-2.3-.5a.8.8 0 0 0-.7 1.3l2.3 2.3 2.3 2.3a.8.8 0 0 0 1.3-.7l-.5-2.3 2.2-2.2 3.4 5.6a1 1 0 0 0 1.7-.9Z"/></svg>
        </div>
        <div>
          <strong>TripWatch <span>AI</span></strong>
          <small>flight &amp; hotel radar</small>
        </div>
      </div>

      <nav class="nav" id="nav">
        <button class="nav-item" data-view="dashboard">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
          <span>Painel</span>
        </button>
        <button class="nav-item" data-view="flights">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17.8 19.2 16 11l3.5-3.5a2.1 2.1 0 0 0-3-3L13 8 4.8 6.2a1 1 0 0 0-.9 1.7l5.6 3.4-2.2 2.2-2.3-.5a.8.8 0 0 0-.7 1.3l2.3 2.3 2.3 2.3a.8.8 0 0 0 1.3-.7l-.5-2.3 2.2-2.2 3.4 5.6a1 1 0 0 0 1.7-.9Z"/></svg>
          <span>Voos</span>
          <span class="nav-count" id="count-flights">0</span>
        </button>
        <button class="nav-item" data-view="hotels">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 18V7"/><path d="M3 12h18a2 2 0 0 1 2 2v4"/><path d="M3 18h20"/><path d="M7 12V9h5v3"/></svg>
          <span>Hotéis</span>
          <span class="nav-count" id="count-hotels">0</span>
        </button>
        <button class="nav-item" data-view="agent">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v2"/><path d="M5 8h14a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2Z"/><path d="M8 13h.01M16 13h.01M9 16h6"/></svg>
          <span>Agente IA</span>
        </button>
        <button class="nav-item" data-view="alerts">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 8-3 8h18s-3-1-3-8"/><path d="M10.3 21a2 2 0 0 0 3.4 0"/></svg>
          <span>Alertas</span>
          <span class="nav-badge" id="count-alerts">0</span>
        </button>
        <button class="nav-item" data-view="repos">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m12 2 9 5-9 5-9-5 9-5Z"/><path d="m3 12 9 5 9-5"/><path d="m3 17 9 5 9-5"/></svg>
          <span>Repositórios</span>
          <span class="nav-count" id="count-repos">0</span>
        </button>
        <button class="nav-item" data-view="settings">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg>
          <span>Configurações</span>
        </button>
      </nav>

      <div class="sidebar-footer">
        <div class="status-card">
          <div class="status-line">
            <span class="dot" id="scheduler-dot"></span>
            <span id="scheduler-label">Agendador iniciando…</span>
          </div>
          <div class="status-sub" id="next-check-label">—</div>
        </div>
        <div class="provider-chip" id="provider-chip">
          <span class="dot"></span><span id="provider-label">provider</span>
        </div>
        <div class="mcp-chip">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 12h8M12 8v8"/><circle cx="12" cy="12" r="9"/></svg>
          MCP pronto · <code>/mcp</code>
        </div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="topbar-title">
          <h1 id="page-title">Painel</h1>
          <p id="page-subtitle">Radar de preços de voos e hotéis com agentes de IA.</p>
        </div>
        <div class="topbar-actions">
          <button class="btn btn-ghost" id="refresh-btn" title="Atualizar dados">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/></svg>
            Atualizar
          </button>
          <button class="btn btn-ghost" id="check-all-btn">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m5 12 5 5L20 7"/></svg>
            Checar agora
          </button>
          <button class="btn btn-primary" id="add-btn">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
            Monitorar
          </button>
        </div>
      </header>
      <div id="view-root" class="view-root"></div>
    </main>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root" class="toast-root"></div>
  <script src="/static/app.js"></script>
</body>
</html>
